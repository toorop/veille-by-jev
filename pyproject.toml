[project]
name = "veille-by-jev"
version = "0.1.0"
description = "Nightly Hacker News technology watch, triaged by Jev and written up as a French Markdown digest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "trafilatura>=2.2.0",
    "typer>=0.12",
    "typesafe-sdk>=0.6.0",
]

[project.scripts]
# Short command: `vbj` for veille-by-jev.
vbj = "veille.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veille"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, N: pep8-naming,
# UP: pyupgrade, B: bugbear, SIM: simplify, D: pydocstyle (Google style).
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "D"]
# Magic methods carry nothing a docstring could add.
ignore = ["D105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names already state what they assert; a docstring would only repeat them.
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
