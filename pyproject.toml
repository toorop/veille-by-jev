[project]
name = "veille-audio"
version = "0.1.0"
description = "Veille technologique Hacker News transformée en digest Markdown quotidien en français"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.scripts]
veille = "veille.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veille"]

[tool.uv]
package = true
