[project]
name = "veille-by-jev"
version = "0.1.0"
description = "Nightly Hacker News technology watch, triaged by Jev and written up as a French Markdown digest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.scripts]
# Commande courte : `vbj` pour veille-by-jev.
vbj = "veille.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veille"]

[tool.uv]
package = true
