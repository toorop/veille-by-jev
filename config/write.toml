# Writing configuration — stage 4 of the pipeline.

[write]
# Model identifier in the form the provider expects. OpenRouter uses "provider/model",
# so changing writer is this one line. Per month, at one digest a night and the current quota
# of fifteen — 32,000 input and 4,100 output tokens, measured on the 2026-09-16 batch. Only the
# Gemini figure was measured at that size; the others are scaled from their eight-item run:
#   deepseek/deepseek-v4-flash     USD 0.06 per month
#   mistralai/mistral-medium-3     USD 0.53 per month
#   google/gemini-2.5-flash        USD 0.59 per month
#   anthropic/claude-sonnet-5      USD 6.97 per month
model = "google/gemini-2.5-flash"

# OpenAI-compatible base URL. OpenRouter by default; another provider or a local
# server would go here, since the writer only speaks the chat-completions protocol.
base_url = "https://openrouter.ai/api/v1"

# Items the digest keeps, best aggregate first, after the admission floor of the grid.
# The floor decides: an item below it never appears, however few items pass. This cap only
# bounds the volume on a rich night. So a quiet night gives fewer items than the quota, and
# that is intended.
digest_size = 15

# The digest is a report, not a piece of writing: low temperature, little room for
# invention.
temperature = 0.3
# Ceiling on the answer, so a runaway completion cannot cost more than expected. Measured
# lengths for eight items: 3,655, 7,230, then more than 8,000 tokens, which cut the JSON
# mid-string. The ceiling has to sit above the worst case, not at the average, and a quota of
# fifteen raises the worst case again, so it stays where it is until a run nears it.
max_tokens = 16000
# One call carries every kept article, so it is slow compared with a triage call.
timeout_s = 180.0

# The system prompt lives in its own file, so the instructions can be tightened — for
# instance on how much to explain, and to whom — without touching any code.
prompt_path = "config/write-prompt.md"

# French labels for the category values. They appear in the digest only: the grid stays
# English because the engine reads it, the digest is French because a human reads it.
# A value missing here falls back to its raw key.
[write.labels]
research = "recherche"
tooling = "outillage"
hardware = "matériel"
industry = "industrie"
society = "société"
