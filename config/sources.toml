# Collection sources configuration — stage 1 of the pipeline.
# This file is meant to be edited without touching any code.

[collect]
# Dates are civil days in this timezone: `--date 2026-09-16` covers 16 September
# from 00:00 to 24:00 local time, converted to UTC for the API.
timezone = "Europe/Paris"

# Items kept per night: this is the input of the triage stage, so it is the cost
# driver. Collection keeps the best scores of the window, not everything published.
target_items = 200

# Minimum Hacker News score for an item to be kept. 1 drops stories with 0 points.
min_points = 1

[sources.hn]
enabled = true
label = "Hacker News"
# Algolia endpoint ranked by relevance (best scores first), filtered on a 24 hour
# window through created_at_i. Verified on 2026-09-17.
endpoint = "https://hn.algolia.com/api/v1/search"
# Kind of entries requested from the API: "story" excludes job offers.
tags = "story"
# 1000 is the maximum the API accepts: a single request covers the whole day
# (observed: 1139 stories published on 2026-09-16).
hits_per_page = 1000
# Maximum number of pages to walk when the window exceeds hits_per_page.
max_pages = 2
timeout_s = 30.0
