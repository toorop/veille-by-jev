# Collection sources configuration — stage 1 of the pipeline.
# This file is meant to be edited without touching any code.

[collect]
# Two ways to cut the collection window, and they answer different needs.
#
# With `--date 2026-09-16`, the window is that whole civil day in this timezone: 16
# September from 00:00 to 24:00 local time, converted to UTC for the API. The same date
# always yields the same batch, whatever time the run happens — that is what makes a run
# replayable and two writers comparable on the same state.
#
# Without `--date`, the window is the last `window_hours` ending at the moment of the
# run, labelled by the civil day it ends in. The digest then never lags, which is the
# point of a watch; the price is that the same label no longer means the same batch, so
# what was already collected is identified by its stored window rather than by its date.
# Running `collect` twice in a day with no `--date` therefore asks for `--force`.
timezone = "Europe/Paris"

# Length of that rolling window, in hours. 24 is "the last day". One value for the whole
# pipeline: the window is decided by `collect` and read back by `write`.
window_hours = 24

# Items are NOT capped here. Collection is free (a single HTTP request) and keeps
# every candidate above min_points, so that the scoring grid can be re-tuned later
# without collecting again. The cap that bounds the priced stages is set where it is
# consumed: enrich first, then triage.

# Minimum Hacker News score for an item to be kept. 1 drops stories with 0 points.
min_points = 1

[sources.hn]
enabled = true
label = "Hacker News"
# Algolia endpoint ranked by relevance (best scores first), filtered on the requested
# window through created_at_i. Verified on 2026-09-17.
endpoint = "https://hn.algolia.com/api/v1/search"
# Kind of entries requested from the API: "story" excludes job offers.
tags = "story"
# 1000 is the maximum the API accepts: a single request covers the whole day
# (observed: 1139 stories published on 2026-09-16, 988 over a rolling 24 h).
hits_per_page = 1000
# Maximum number of pages to walk when the window exceeds hits_per_page.
max_pages = 2
timeout_s = 30.0

[enrich]
# Candidates enriched per night, best scores first. This is where the cap bounding
# the priced stages starts: items.json keeps the whole day, but only these items are
# fetched, and they are what triage will see. Items beyond the cap stay in
# items.json and can be enriched later without collecting again.
max_items = 200

# Body text kept per article, in estimated tokens. Truncation is the main cost lever
# of the next stage, since only the input of the triage model is billed. Measured on
# 2026-09-16: the median article extracts to about 1,100 estimated tokens, so the
# ceiling only bites on long-form pieces.
max_text_tokens = 2000

# Floor below which the extraction is not worth calling an article: a page that
# yields almost nothing (JavaScript shell, empty body) is marked `unavailable`, and
# triage then judges on the title and metadata alone. Set to 0 to accept any text.
min_text_tokens = 200

# Top-level Hacker News comments kept per item, in the order the API returns them
# (insertion order, close to chronological but not sorted by time). Each comment
# costs one extra HTTP request. Set to 0 to skip the thread entirely.
max_comments = 5

# Text kept per comment, in estimated tokens.
max_comment_tokens = 120

# Characters per token used by the estimate. Rough on purpose: the figure that
# counts is the one Jev bills, so calibrate this against the first real invoice.
chars_per_token = 4.0

# Per-request timeout for articles and for the Hacker News API.
timeout_s = 30.0

