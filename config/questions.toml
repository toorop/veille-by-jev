# Triage configuration — stage 3 of the pipeline.
# This is the file to iterate on triage quality: nothing here should ever require
# touching code.
#
# The grid is written in English, like the rest of the configuration: the engine reads
# it, and English is what it handles best. French is reserved for the digest, which is
# the only thing a human reads.

[triage]
# Jev model name; the SDK default is "jev-latest".
model = "jev-latest"

# Ranking rule. An item is ranked on `score - z × spread`, where `spread` is the standard
# deviation of the level distribution the engine returns. This is a lower bound on the
# position rather than the position itself: an item hesitating between two neighbouring
# levels loses little, one hesitating between "no interest" and "essential" loses a lot.
#
# Calibrated on the first real run (2026-09-16, five items). Filtering on the confidence
# alone ranked backwards: the best-scored item of the day (2.80) had a low confidence of
# 0.51 only because its mass sat between levels 2 and 3 — two high, neighbouring levels —
# while an item firmly at level 2 came back with a confidence of 0.80. Confidence measures
# how precise the position is, not how high it is.
#
# z = 0 ranks on the raw score. Raise it to demand more certainty.
score_penalty_z = 1.0

# An item is kept when its adjusted score reaches this value on the level scale. At 2.0 an
# item must still look at least "useful" once its downside is subtracted.
#
# Calibrated on the full 2026-09-16 batch (200 items): the distribution has no natural
# break, so the floor is not read off the shape but chosen from what we want to read. A
# floor of 1.0 kept 61 items, far too many for a digest; 2.0 keeps 14, of which the writer
# takes the best 8. The floor guarantees a minimum quality on a quiet night, the digest
# size caps the volume, and the two roles stay separate.
min_adjusted_score = 2.0

# Input price in USD per million tokens, used to print the cost of a run. Output is
# free. The response reports the real token counts; the note in docs/ is updated from
# measurements, not from this file. The character-based estimate used to bound the state
# understates this invoice by a measured factor of 1.22.
price_per_mtok_usd = 0.042

# Candidates scored per night, best adjusted score first. Only items that were enriched
# are considered, so this is a safety net above the enrichment cap rather than the place
# where the volume is decided.
max_items = 200

# One `Score`: a position on an ordered spectrum, described level by level. `score`
# comes back as a float that can land between two levels, so the levels should read
# as a progression rather than as boxes.
[questions.interest]
type = "score"
instructions = "Interest for a French-speaking developer who follows applied AI and local tooling."
criteria = [
  "No interest: marketing, fundraising, or a topic outside the field",
  "Marginal: a small tool or a minor announcement",
  "Useful: a solid article or a release a practitioner would read",
  "Important: a technique or a tool that changes daily practice",
  "Essential: a major release, a foundational paper, or a shift in the field",
]

# A second `Score`: how much there is to learn, from research paper to pure announcement.
[questions.density]
type = "score"
instructions = "Technical density: does this teach something, or does it announce something?"
criteria = [
  "Pure marketing: an announcement with nothing to learn from",
  "Shallow: a short post or a release note, no implementation detail",
  "Concrete: some detail, a benchmark, or a real example",
  "Deep: a technique explained well enough to be reused",
  "Research-grade: a paper, a specification, or an architecture worth studying",
]

# A `Choice`: recorded as a label for the digest. It is deliberately absent from the
# weights table below, because a category is not a quality signal.
[questions.category]
type = "choice"
instructions = "Which category does this item belong to?"

[questions.category.criteria]
research = "A paper, a benchmark, or a method"
tooling = "A tool, a library, a framework, or a way of working"
hardware = "Chips, machines, or infrastructure"
industry = "Companies, funding, or strategy"
society = "Policy, law, ethics, or social impact"

# A `Noul`: yes or no as a probability, with no separate confidence field.
[questions.primary_source]
type = "noul"
instructions = "Is this a primary source — a paper, an official announcement, or a code repository — rather than a report about one?"

[aggregation]
# The aggregate is expressed on this scale, matching the level scale of a five-level
# `Score`, so that `min_adjusted_score` keeps the meaning it was calibrated with: 1.0 is
# "still at least marginal once the downside is subtracted".
scale = 4.0

# Weight of each question in the aggregate. Weights are relative and get normalised, so
# they only have to express importance. A question with no weight here is still recorded
# and still costs its tokens, it just does not rank — which is the case for the category.
#
# The example formula in the scoping notes mixed scales: two positions on 0–4 and a
# probability on 0–1. Read literally it gave the primary-source signal a real weight of
# 5% where it looked like 20%. Each component is therefore normalised to [0, 1] before
# weighting; the downside penalty applies to each component's own distribution.
[aggregation.weights]
interest = 0.5
density = 0.3
primary_source = 0.2
